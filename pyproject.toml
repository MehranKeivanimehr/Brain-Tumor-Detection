[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btmri"
version = "0.1.0"
description = "Validity-first brain tumor MRI classification: patient-level evaluation, closed-form learners with exact leave-one-patient-out identities, and patient-level conformal prediction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mehran Keivanimehr" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "scikit-image>=0.22",
  "pandas>=2.0",
  "pydicom>=2.4",
  "PyWavelets>=1.5",
]

[project.optional-dependencies]
data = ["idc-index>=0.5"]
features = ["kymatio>=0.3", "tensorflow-cpu>=2.15", "keras>=3.0"]
figures = ["matplotlib>=3.8", "pillow>=10", "imageio>=2.30"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
